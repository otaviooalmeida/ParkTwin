[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parktwin"
version = "0.2.0"
description = "Parking occupancy monitoring with computer vision and a digital twin."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "numpy==2.2.6",
  "opencv-python-headless==4.11.0.86",
  "pydantic==2.11.7",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dashboard = ["streamlit==1.48.1"]
inference = ["ultralytics==8.3.191", "yt-dlp==2025.08.20"]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.coverage.run]
omit = ["src/dashboard/*", "src/detection/predict.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
