services:
  api:
    build: .
    environment:
      PARKTWIN_DB_PATH: /app/data/parktwin.db
      PARKTWIN_OUTPUTS_DIR: /app/data/outputs
      PARKTWIN_UPLOADS_DIR: /app/data/uploads
      PARKTWIN_BASE_IMAGE_PATH: /app/data/uploads/base_image.jpg
      PARKTWIN_SPOTS_PATH: /app/data/samples/spots_annotated.json
      PARKTWIN_MODEL_PATH: /app/models/yolo11s.pt
      PARKTWIN_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      PARKTWIN_MAX_UPLOAD_BYTES: ${PARKTWIN_MAX_UPLOAD_BYTES:-15728640}
      PARKTWIN_OCCUPANCY_THRESHOLD: ${PARKTWIN_OCCUPANCY_THRESHOLD:-0.10}
      PARKTWIN_UNCERTAIN_OVERLAP_THRESHOLD: ${PARKTWIN_UNCERTAIN_OVERLAP_THRESHOLD:-0.05}
      PARKTWIN_CHANGE_CONFIRMATION_FRAMES: ${PARKTWIN_CHANGE_CONFIRMATION_FRAMES:-2}
      PARKTWIN_RETENTION_SNAPSHOTS: ${PARKTWIN_RETENTION_SNAPSHOTS:-10000}
    volumes:
      - ./data:/app/data
      - ./yolo11s.pt:/app/models/yolo11s.pt:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  worker-youtube:
    build: .
    profiles:
      - worker
    command:
      - python
      - scripts/run_parktwin_youtube.py
    environment:
      PARKTWIN_DB_PATH: /app/data/parktwin.db
      PARKTWIN_OUTPUTS_DIR: /app/data/outputs
      PARKTWIN_UPLOADS_DIR: /app/data/uploads
      PARKTWIN_BASE_IMAGE_PATH: /app/data/uploads/base_image.jpg
      PARKTWIN_SPOTS_PATH: /app/data/samples/spots_annotated.json
      PARKTWIN_MODEL_PATH: /app/models/yolo11s.pt
      PARKTWIN_YOUTUBE_URL: ${PARKTWIN_YOUTUBE_URL:-https://www.youtube.com/watch?v=EPKWu223XEg}
      PARKTWIN_INTERVAL_SECONDS: ${PARKTWIN_INTERVAL_SECONDS:-5}
      PARKTWIN_PARKING_LOT_ID: ${PARKTWIN_PARKING_LOT_ID:-youtube-live}
      PARKTWIN_OCCUPANCY_THRESHOLD: ${PARKTWIN_OCCUPANCY_THRESHOLD:-0.10}
      PARKTWIN_UNCERTAIN_OVERLAP_THRESHOLD: ${PARKTWIN_UNCERTAIN_OVERLAP_THRESHOLD:-0.05}
      PARKTWIN_CHANGE_CONFIRMATION_FRAMES: ${PARKTWIN_CHANGE_CONFIRMATION_FRAMES:-2}
      PARKTWIN_RETENTION_SNAPSHOTS: ${PARKTWIN_RETENTION_SNAPSHOTS:-10000}
      PARKTWIN_LOG_LEVEL: ${PARKTWIN_LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./yolo11s.pt:/app/models/yolo11s.pt:ro
